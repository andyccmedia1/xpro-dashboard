name: Daily Amazon Data Pull

on:
  # Runs at 1:00 PM UTC = 9 AM ET / 6 AM PT (scheduled).
  # GitHub Actions typically fires 1-2 h late → actual ~2-3 PM UTC.
  # Amazon finalises the previous day's data by ~12:00 PM UTC, so this is safe.
  schedule:
    - cron: '0 13 * * *'

  # Manual trigger from the GitHub Actions UI — useful for backfills or re-runs.
  workflow_dispatch:
    inputs:
      date:
        description: 'Single date (YYYY-MM-DD). Leave blank for yesterday.'
        required: false
        default: ''
      start_date:
        description: 'Backfill start date (YYYY-MM-DD). Use with end_date.'
        required: false
        default: ''
      end_date:
        description: 'Backfill end date (YYYY-MM-DD). Use with start_date.'
        required: false
        default: ''
      orders_only:
        description: 'Orders API only — populate heatmap (hourly_sales) without re-running SP-API or Ads API. Check this for a fast heatmap-only pull.'
        required: false
        type: boolean
        default: false
      campaigns_only:
        description: 'Per-campaign Ads data only — populate campaign_daily (budget allocation) without re-running anything else.'
        required: false
        type: boolean
        default: false
      ledger_only:
        description: 'FBA Inventory Ledger only — populate fba_daily_shipped (MCF-inclusive depletion for replenishment forecasting). Skips everything else.'
        required: false
        type: boolean
        default: false
      shopify_only:
        description: 'Shopify online-store MCF units only — populate shopify_daily_shipped (the MCF half of FBA depletion). Skips everything else.'
        required: false
        type: boolean
        default: false

jobs:
  pull:
    name: Pull Amazon → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 360  # up to 6 hours — covers multi-month backfills (~4 min/day)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-amazon-sp-api==2.1.8 requests python-dotenv

      - name: Pull Amazon data
        run: |
          # Build base command — add a "-only" flag when its checkbox is checked
          CMD="python scripts/daily_pull_supabase.py"
          if [ "${{ github.event.inputs.orders_only }}" = "true" ]; then
            CMD="$CMD --orders-only"
          fi
          if [ "${{ github.event.inputs.campaigns_only }}" = "true" ]; then
            CMD="$CMD --campaigns-only"
          fi
          if [ "${{ github.event.inputs.ledger_only }}" = "true" ]; then
            CMD="$CMD --ledger-only"
          fi
          if [ "${{ github.event.inputs.shopify_only }}" = "true" ]; then
            CMD="$CMD --shopify-only"
          fi

          if [ -n "${{ github.event.inputs.start_date }}" ] && [ -n "${{ github.event.inputs.end_date }}" ]; then
            $CMD --start "${{ github.event.inputs.start_date }}" --end "${{ github.event.inputs.end_date }}"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            $CMD --date "${{ github.event.inputs.date }}"
          else
            $CMD
          fi
        env:
          # ── SP-API ─────────────────────────────────────────────────────────
          AMAZON_SP_CLIENT_ID:       ${{ secrets.AMAZON_SP_CLIENT_ID }}
          AMAZON_SP_CLIENT_SECRET:   ${{ secrets.AMAZON_SP_CLIENT_SECRET }}
          AMAZON_SP_REFRESH_TOKEN:   ${{ secrets.AMAZON_SP_REFRESH_TOKEN }}
          AMAZON_MARKETPLACE_ID:     ${{ secrets.AMAZON_MARKETPLACE_ID }}
          # ── Ads API ────────────────────────────────────────────────────────
          AMAZON_ADS_CLIENT_ID:      ${{ secrets.AMAZON_ADS_CLIENT_ID }}
          AMAZON_ADS_CLIENT_SECRET:  ${{ secrets.AMAZON_ADS_CLIENT_SECRET }}
          AMAZON_ADS_REFRESH_TOKEN:  ${{ secrets.AMAZON_ADS_REFRESH_TOKEN }}
          AMAZON_ADS_PROFILE_ID:     ${{ secrets.AMAZON_ADS_PROFILE_ID }}
          # ── Supabase ───────────────────────────────────────────────────────
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # ── Shopify (online-store MCF depletion) ────────────────────────────
          SHOPIFY_STORE_DOMAIN:      ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN:       ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          # ── Brand ──────────────────────────────────────────────────────────
          ACTIVE_BRAND:              xpro
